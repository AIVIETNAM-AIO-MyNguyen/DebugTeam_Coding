# Ablation 2: Pyramid-ResMLP with DW 3x3 Branch Only
# Tests the contribution of local 3x3 receptive field alone (reparam_conv_k: [3])

experiment:
  tag: "ablation_2_rep_3x3_only"
  base_dir: "runs"

training:
  seed: 42
  deterministic: true
  epochs: 50
  lr: 0.001
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.1

optimizer:
  name: "adamw"
  weight_decay: 0.05

scheduler:
  name: "cosine"
  min_lr: 1e-6

data:
  dataset: "tiny_imagenet"
  data_dir: "data/tiny_imagenet"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  image_size: 64
  download: true

augmentation:
  auto_augment: false
  rand_augment: true
  random_erasing: 0.1
  color_jitter: 0.1
  use_mixup: true
  mixup_alpha: 0.8
  cutmix_alpha: 1.0

model:
  name: "pyramid_res_mlp"
  image_size: 64
  patch_size: 4
  num_classes: 200
  channels: [64, 128, 256]
  num_blocks: [2, 2, 2]
  expansion_factor: 4
  reparam_conv_k: [3]
  drop_path_rate: 0.1
  dropout: 0.1
