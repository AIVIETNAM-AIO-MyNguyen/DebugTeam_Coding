# Configuration: ResMLP-LocalStem on Tiny-ImageNet-200

experiment:
  tag: "tiny_imagenet_res_mlp_local_stem"
  base_dir: "runs"

training:
  seed: 42
  deterministic: true
  epochs: 100
  lr: 0.001
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.1

optimizer:
  name: "adamw"
  weight_decay: 0.05

scheduler:
  name: "cosine"
  min_lr: 1e-6

data:
  dataset: "tiny_imagenet"
  data_dir: "data/tiny_imagenet"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  image_size: 64
  download: true

augmentation:
  auto_augment: false
  rand_augment: true
  random_erasing: 0.1
  color_jitter: 0.1
  use_mixup: true
  mixup_alpha: 0.8
  cutmix_alpha: 1.0

model:
  name: "res_mlp_local_stem"
  image_size: 64
  patch_size: 4
  num_features: 128
  expansion_factor: 2
  num_layers: 8
  num_stem_blocks: 2
  num_classes: 200
  reparam_conv_k: [1, 3]
