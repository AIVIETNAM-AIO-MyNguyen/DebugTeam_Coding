# Configuration: MLP-Mixer on Tiny-ImageNet-200

experiment:
  tag: "tiny_imagenet_mlp_mixer"
  base_dir: "runs"

training:
  seed: 42
  deterministic: true
  epochs: 100
  lr: 0.001
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.1

optimizer:
  name: "adamw"
  weight_decay: 0.05

scheduler:
  name: "cosine"
  min_lr: 1e-6

data:
  dataset: "tiny_imagenet"
  data_dir: "data/tiny_imagenet"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  image_size: 64
  download: true

augmentation:
  auto_augment: false
  rand_augment: true
  random_erasing: 0.1
  color_jitter: 0.1
  use_mixup: true
  mixup_alpha: 0.8
  cutmix_alpha: 1.0

model:
  name: "mlp_mixer"
  image_size: 64
  patch_size: 8
  hidden_dim: 384
  num_blocks: 8
  tokens_mlp_dim: 192
  channels_mlp_dim: 768
  dropout: 0.1
