[project]
name = "mlp-experiments"
version = "0.1.0"
description = "A modular and reproducible research codebase for MLP-variant experiments (MLP-Mixer, ResMLP, gMLP, etc.)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DebugTeam" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.2",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "requests>=2.28.0",
    "pillow>=9.5.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
