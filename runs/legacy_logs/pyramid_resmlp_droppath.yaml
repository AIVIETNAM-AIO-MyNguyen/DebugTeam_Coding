experiment:
  name: 20261004_131658_pyramid_res_mlp_tiny_imagenet_pyramid_res_mlp_droppath_s42
  tag: pyramid_res_mlp_droppath
  base_dir: runs
training:
  seed: 42
  deterministic: true
  epochs: 100
  lr: 0.0004
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.1
optimizer:
  name: adamw
  weight_decay: 0.1
  momentum: 0.9
scheduler:
  name: cosine
  min_lr: 1e-6
  step_size: 30
  gamma: 0.1
data:
  dataset: tiny_imagenet
  data_dir: data/tiny_imagenet
  batch_size: 128
  num_workers: 2
  pin_memory: true
  image_size: 64
  val_split: 0.1
  download: true
augmentation:
  auto_augment: false
  rand_augment: true
  random_erasing: 0.25
  color_jitter: 0.1
  use_mixup: true
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
model:
  name: pyramid_res_mlp
  patch_size: 4
  hidden_dim: 256
  num_blocks:
  - 2
  - 4
  - 6
  tokens_mlp_dim: 128
  channels_mlp_dim: 512
  dropout: 0.1
  image_size: 64
  num_classes: 200
  channels:
  - 112
  - 224
  - 448
  expansion_factor: 4
  reparam_conv_k:
  - 1
  - 3
  drop_path_rate: 0.05
